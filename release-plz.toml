[workspace]
git_only = true
release_always = false
features_always_increment_minor = false
semver_check = false
git_tag_enable = false
git_release_enable = false
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
publish = false

[[package]]
name = "sase_core"
version_group = "sase-core"
# sase_core_py is the PyPI distribution. sase_gateway is not published to
# crates.io, but the wheel bundles it (sudo runner, host gateway). Gateway-only
# ABI fixes must appear in this changelog so they bump sase-core-rs; otherwise
# tagged-but-unpublished versions keep rebuilding from the last sase_core tag
# and never pick up the fix.
changelog_include = ["sase_core_py", "sase_gateway"]
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "sase_core_py"
version_group = "sase-core"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "sase_gateway"
release = false

[[package]]
name = "sase_xprompt_lsp"
release = false

[[package]]
name = "sase_workspace_hack"
release = false
# git_only mode runs a tag lookup for every workspace member, even
# `release = false` ones, and loads the package from the matched tag's tree.
# This crate is never tagged, so its template must match no existing tag, or
# `release-pr` fails with "cannot find package".
git_tag_name = "sase_workspace_hack-v{{ version }}"
