[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sase-core-rs"
dynamic = ["version"]
description = "Rust core for the sase TUI/CLI: PyO3 bindings exposing the Patch parser, query language, agent-artifact scan, status state machine, and git-query parsers."
readme = "PYPI_README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "sase-org" }]
keywords = ["sase", "changespec", "pyo3", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/sase-org/sase-core"
Repository = "https://github.com/sase-org/sase-core"
Issues = "https://github.com/sase-org/sase-core/issues"

# Distribution name (`sase-core-rs`) differs from the import module name
# (`sase_core_rs`). The crate name `sase_core_py` is the Cargo crate name
# only; consumers `import sase_core_rs` and `pip install sase-core-rs`.
#
# `python-source = "python"` swaps maturin's auto-generated package init
# (a star-import template that binds the extension module name only via
# importlib's post-import `setattr` side effect) for the explicit one
# under `python/sase_core_rs/__init__.py`, which imports the submodule by
# name before re-exporting it. The auto-generated version raises
# `NameError` if a consumer re-imports `sase_core_rs` while the compiled
# submodule is still cached in `sys.modules` but the parent package entry
# was evicted or swapped.
[tool.maturin]
module-name = "sase_core_rs"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
# Strip release wheels so platform downloads stay small.
strip = true
