name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: cargo fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # NOTE (cost): macOS runner minutes bill above the Linux rate. If that
    # becomes a concern, follow the two-speed pattern and move the exhaustive
    # matrix off the push path instead of dropping the macOS signal.
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: |
          # POSIX bracket classes, not \s: BSD sed/grep on the macOS runner do
          # not understand \s, so the substitution silently passed the whole
          # line through as the toolchain name. The trailing '|| true' keeps
          # GitHub's 'bash -e' from aborting before the explicit validation
          # below names the failure.
          channel=$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' || true)
          components=$(grep -E '^components[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*=[[:space:]]*\[(.*)\]/\1/' | tr -d '"' || true)
          if [ -z "$channel" ] || printf '%s' "$channel" | grep -qE '[[:space:]=]'; then
            echo "::error::Failed to parse a valid channel from rust-toolchain.toml (got '${channel}')" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "components=${components}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # crates/sase_core_py pins pyo3's abi3-py312 feature, which hard-errors
      # against any interpreter older than 3.12. Pin an explicit 3.12 rather
      # than trusting the runner image so an image update cannot produce the
      # opaque pyo3-build-config error (scripts/check.sh also resolves a
      # qualifying interpreter itself as a second layer).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks-${{ matrix.os }}
          workspaces: ". -> target"

      - name: cargo fmt --all -- --check
        run: ./scripts/check.sh fmt-check

      - name: unified dependency features
        run: ./scripts/check.sh features

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: ./scripts/check.sh clippy

      - name: cargo test --workspace
        run: ./scripts/check.sh test

  # Stdlib-only unit checks for the helper scripts the Release-plz workflow
  # runs, e.g. the publish-plan completeness gate. No toolchain or cache needed.
  release-scripts:
    name: release workflow scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: python3 -m unittest .github/scripts
        run: ./scripts/check.sh script-test

  wheel-smoke:
    name: maturin build + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel-smoke
          workspaces: ". -> target"

      - name: Cache pip / maturin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/maturin
          key: ${{ runner.os }}-maturin-${{ hashFiles('Cargo.lock', 'crates/sase_core_py/Cargo.toml', 'crates/sase_core_py/pyproject.toml') }}

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sase_core_py
          args: --release --out dist --strip
          manylinux: "2_28"

      - name: Run wheel smoke in fresh venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install crates/sase_core_py/dist/*.whl
          /tmp/smoke/bin/python -c "import sase_core_rs; print('ok')"
          /tmp/smoke/bin/python -c "import sase_core_rs; print(sase_core_rs.parse_query('status:Ready'))"
          /tmp/smoke/bin/python -c "from pathlib import Path; assert Path('/tmp/smoke/bin/sase_gateway').is_file(); assert Path('/tmp/smoke/bin/sase_federation_worker').is_file(); assert Path('/tmp/smoke/bin/sase_sudo_runner').is_file()"
          /tmp/smoke/bin/python -c "import sase_core_rs.gateway as gateway; import sase_core_rs.federation_worker as worker; import sase_core_rs.sudo_runner as sudo_runner; assert callable(gateway.main); assert callable(worker.main); assert callable(sudo_runner.main)"
          /tmp/smoke/bin/sase_gateway --help
          /tmp/smoke/bin/sase_federation_worker --help
          /tmp/smoke/bin/sase_sudo_runner --help
          /tmp/smoke/bin/python -c "
          import sase_core_rs
          # '(' is a syntactically incomplete query: parser sees '(' then
          # EOF, which is a stable error shape across the parser refactors
          # in Phase 2. '!!!' is NOT used because '!' is the error-suffix
          # operator and parses as a string match.
          try:
              sase_core_rs.parse_query('(')
          except ValueError as e:
              print('expected ValueError:', e)
          else:
              raise SystemExit('parse_query(\"(\") should have raised ValueError')
          "

      - name: twine check
        run: |
          /tmp/smoke/bin/pip install --quiet twine
          /tmp/smoke/bin/twine check crates/sase_core_py/dist/*
